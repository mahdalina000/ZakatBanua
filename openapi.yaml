openapi: 3.0.3
info:
  title: ZakatBanua API
  description: |
    Kontrak API resmi untuk aplikasi ZakatBanua.
    Design-First - file ini adalah sumber kebenaran tunggal (Single Source of Truth).
    Semua implementasi backend (Laravel) dan frontend harus mengacu ke kontrak ini.
    Base URL lokal via Laradock: https://zakat-banua.test/api
  version: 1.0.0
  contact:
    name: Tim ZakatBanua
    url: https://github.com/mahdalina000/ZakatBanua
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://zakat-banua.test/api
    description: Local - Laradock (https)
  - url: http://zakat-banua.test/api
    description: Local - Laradock (http)
  - url: http://localhost/api
    description: Fallback localhost
  - url: https://api.zakatbanua.example.com/api
    description: Production (ganti sesuai domain)
tags:
  - name: Auth
    description: Autentikasi dan manajemen sesi
  - name: Kalkulator
    description: Perhitungan zakat fitrah dan zakat mal
  - name: Harga Beras
    description: Harga beras acuan zakat fitrah
  - name: Direktori
    description: Direktori lokasi BAZNAS / UPZ / Masjid
  - name: User
    description: Manajemen user (admin)
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi user baru
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              contoh:
                value:
                  name: Ahmad Fauzi
                  email: ahmad@example.com
                  password: password123
                  password_confirmation: password123
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              contoh:
                value:
                  email: admin@baznas.go.id
                  password: password123
                  remember: false
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: authLogout
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Berhasil logout
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/me:
    get:
      tags: [Auth]
      summary: Ambil profil user yang sedang login
      operationId: authMe
      responses:
        '200':
          description: Data user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /kalkulator/zakat-fitrah:
    post:
      tags: [Kalkulator]
      summary: Hitung zakat fitrah
      operationId: hitungZakatFitrah
      security: []
      description: |
        Menghitung zakat fitrah berdasarkan harga beras terkini.
        Aturan: 1 jiwa = 2.5 kg beras atau setara uang (2.5 * harga_beras).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jumlah_jiwa]
              properties:
                jumlah_jiwa:
                  type: integer
                  minimum: 1
                  example: 4
                  description: Jumlah jiwa yang ditanggung
                harga_beras_override:
                  type: integer
                  nullable: true
                  example: 16000
                  description: Opsional, override harga beras per kg (rupiah)
            examples:
              keluarga4:
                value:
                  jumlah_jiwa: 4
      responses:
        '200':
          description: Hasil perhitungan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jumlah_jiwa:
                        type: integer
                        example: 4
                      harga_beras_per_kg:
                        type: integer
                        example: 16000
                      beras_kg:
                        type: number
                        example: 10
                        description: Total beras (kg) = jumlah_jiwa * 2.5
                      total_rupiah:
                        type: integer
                        example: 160000
                        description: Total rupiah = beras_kg * harga_beras
                      harga_beras_sumber:
                        type: string
                        enum: [database, override, default]
                        example: database
        '422':
          $ref: '#/components/responses/ValidationError'
  /kalkulator/zakat-mal:
    post:
      tags: [Kalkulator]
      summary: Hitung zakat mal (harta)
      operationId: hitungZakatMal
      security: []
      description: |
        Nishab zakat mal = 85 gram emas. Jika harta >= nishab dan haul 1 tahun, zakat = 2.5 persen.
        Endpoint menerima harga_emas_per_gram agar fleksibel (default 1100000 jika tidak diisi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total_harta]
              properties:
                total_harta:
                  type: integer
                  minimum: 0
                  example: 100000000
                  description: Total harta yang dimiliki (rupiah)
                harga_emas_per_gram:
                  type: integer
                  example: 1100000
                  description: Harga emas per gram terkini
            examples:
              contoh:
                value:
                  total_harta: 100000000
                  harga_emas_per_gram: 1100000
      responses:
        '200':
          description: Hasil perhitungan zakat mal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_harta:
                        type: integer
                        example: 100000000
                      nishab:
                        type: integer
                        example: 93500000
                        description: 85 * harga_emas_per_gram
                      wajib_zakat:
                        type: boolean
                        example: true
                      zakat:
                        type: integer
                        example: 2500000
                        description: 2.5 persen dari total_harta jika wajib
                      persentase:
                        type: number
                        example: 2.5
        '422':
          $ref: '#/components/responses/ValidationError'
  /beras-price:
    get:
      tags: [Harga Beras]
      summary: Ambil harga beras terkini
      operationId: getBerasPrice
      security: []
      responses:
        '200':
          description: Harga beras terkini
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BerasPrice'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Harga Beras]
      summary: Update harga beras (Admin/Super Admin)
      operationId: updateBerasPrice
      description: Hanya role super_admin, admin_baznas, admin_upz, admin yang boleh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price:
                  type: integer
                  minimum: 1000
                  example: 16500
                note:
                  type: string
                  nullable: true
                  example: Update harga pasar Mei 2026
      responses:
        '200':
          description: Berhasil update
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Harga beras diperbarui
                  data:
                    $ref: '#/components/schemas/BerasPrice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /locations:
    get:
      tags: [Direktori]
      summary: Daftar lokasi (paginated, filterable)
      operationId: listLocations
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [baznas, upz, warga]
          description: Filter berdasarkan tipe
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Cari nama/alamat/kelurahan/kecamatan
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar lokasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Location'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Direktori]
      summary: Tambah lokasi baru (Admin)
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Lokasi dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lokasi berhasil ditambahkan
                  data:
                    $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /locations/{id}:
    get:
      tags: [Direktori]
      summary: Detail lokasi
      operationId: getLocation
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detail lokasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Direktori]
      summary: Update lokasi (Admin)
      operationId: updateLocation
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Lokasi diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lokasi diperbarui
                  data:
                    $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Direktori]
      summary: Hapus lokasi (Admin/Super Admin)
      operationId: deleteLocation
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Lokasi dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lokasi dihapus
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token Sanctum / JWT. Kirim sebagai header Authorization: Bearer ***'
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID resource
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Admin BAZNAS
        email:
          type: string
          format: email
          example: admin@baznas.go.id
        role:
          type: string
          enum: [super_admin, admin_baznas, admin_upz, admin, user]
          example: admin_baznas
        role_label:
          type: string
          example: Admin BAZNAS
        is_active:
          type: boolean
          example: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-07T13:00:00.000000Z'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BerasPrice:
      type: object
      properties:
        id:
          type: integer
          example: 1
        price:
          type: integer
          example: 16000
          description: Harga per kg dalam rupiah
        note:
          type: string
          nullable: true
          example: Harga acuan BAZNAS Oktober 2026
        updated_by:
          type: integer
          nullable: true
          example: 1
        updater:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Location:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Masjid Al-Ikhlas UPZ
        address:
          type: string
          example: Jl. Merdeka No. 10, Bukittinggi
        kelurahan:
          type: string
          nullable: true
          example: Benteng Pasar Atas
        kecamatan:
          type: string
          nullable: true
          example: Guguk Panjang
        latitude:
          type: string
          nullable: true
          example: '-0.3050000'
        longitude:
          type: string
          nullable: true
          example: '100.3690000'
        type:
          type: string
          enum: [baznas, upz, warga]
          example: upz
        type_label:
          type: string
          example: UPZ / Masjid
        description:
          type: string
          nullable: true
          example: Menerima zakat fitrah dan mal
        phone:
          type: string
          nullable: true
          example: '081234567890'
        opening_hours:
          type: string
          nullable: true
          example: '08:00-17:00'
        is_active:
          type: boolean
          example: true
        created_by:
          type: integer
          nullable: true
        creator:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LocationRequest:
      type: object
      required: [name, address, type]
      properties:
        name:
          type: string
          maxLength: 255
          example: Masjid Al-Ikhlas UPZ
        address:
          type: string
          example: Jl. Merdeka No. 10
        kelurahan:
          type: string
          nullable: true
          example: Benteng Pasar Atas
        kecamatan:
          type: string
          nullable: true
          example: Guguk Panjang
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          example: -0.305
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: 100.369
        type:
          type: string
          enum: [baznas, upz, warga]
          example: upz
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        opening_hours:
          type: string
          nullable: true
          example: '08:00-17:00'
        is_active:
          type: boolean
          default: true
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: Ahmad Fauzi
        email:
          type: string
          format: email
          example: ahmad@example.com
        password:
          type: string
          minLength: 8
          example: password123
        password_confirmation:
          type: string
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@baznas.go.id
        password:
          type: string
          example: password123
        remember:
          type: boolean
          default: false
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: Login berhasil
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          nullable: true
          example: 1|abc123token
          description: Jika menggunakan Sanctum token. Null jika pakai session cookie.
    PaginatedResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 42
            last_page:
              type: integer
              example: 3
        links:
          type: object
          properties:
            first:
              type: string
              nullable: true
            last:
              type: string
              nullable: true
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Terjadi kesalahan
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            contoh:
              value:
                message: Validasi gagal
                errors:
                  email:
                    - Email sudah digunakan.
    UnauthorizedError:
      description: Belum autentikasi
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
    ForbiddenError:
      description: Tidak memiliki izin (role tidak sesuai)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Forbidden. Hanya admin yang dapat mengakses.
    NotFoundError:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Data tidak ditemukan.